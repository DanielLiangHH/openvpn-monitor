<div class="vpn-card vpn-card--error" id="{{ vpn | get_vpn_anchor }}">

  </div>
  <div class="vpn-card__body">
    <p class="vpn-card__message">{{ _('Could not connect to') }} <code>{{ vpn | get_vpn_error }}</code></p>
  </div>
</div>
