# Babel 提取配置
# 用法（在项目根目录执行）：
#   pybabel extract -F babel.cfg -o messages.pot .
#   pybabel update -i messages.pot -d openvpn_monitor/translations
#   pybabel compile -d openvpn_monitor/translations

[python: openvpn_monitor/**.py]
[jinja2: openvpn_monitor/templates/**.html]
extensions=jinja2.ext.i18n
